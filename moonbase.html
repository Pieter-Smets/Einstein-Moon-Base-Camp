<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moonbase – Interactive Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f4f5f8;--panel:#fff;--ink:#14161f;--mute:#5b6070;--line:#d9dce6;--paper:#f8f8f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0c10;--panel:#171922;--ink:#eceef5;--mute:#9aa0b4;--line:#2b2e3b}}
:root[data-theme="dark"]{--bg:#0b0c10;--panel:#171922;--ink:#eceef5;--mute:#9aa0b4;--line:#2b2e3b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:20px;margin:0;flex:1;white-space:nowrap}
header h1 span{color:var(--mute);font-weight:400;font-size:14px;margin-left:8px}
.chips{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:2px 0}
.chip,.btn{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;min-height:40px;text-decoration:none;display:inline-flex;align-items:center}
.chip.on{background:var(--c);border-color:var(--c);color:#14161f;font-weight:600}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:14px;padding:14px}
@media (orientation:portrait){main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}}
.stage{background:var(--paper);border-radius:18px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
.map{position:relative;width:100%;max-height:100%;aspect-ratio:2156/1712}
@supports (aspect-ratio:1){.map{height:auto}}
.map>svg{position:absolute;inset:0;width:100%;height:100%}
.hs{fill:transparent;cursor:pointer;transition:fill .2s}
.hs:hover,.hs.on{fill:color-mix(in srgb,var(--c) 38%,transparent)}
.hs.on{stroke:var(--c);stroke-width:5;stroke-dasharray:14 9}
.hint .hs{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{fill:color-mix(in srgb,var(--c) 30%,transparent)}}
@media (prefers-reduced-motion:reduce){.hint .hs{animation:none}}
aside{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;overflow-y:auto;min-height:0}
aside .tag{display:inline-block;background:var(--c,#f5a3d6);color:#14161f;font-weight:700;letter-spacing:.06em;font-size:12px;padding:3px 10px;border-radius:6px;text-transform:uppercase}
aside h2{margin:10px 0 4px;font-size:28px;line-height:1.15}
.lead{color:var(--mute);margin:0 0 16px;font-size:17px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:0 0 18px}
.fact{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fact b{display:block;font-size:22px;line-height:1.2}
.fact span{font-size:13px;color:var(--mute)}
aside h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:18px 0 6px}
.todo{border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px;color:var(--mute);margin:0 0 10px}
.sim{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.go{background:var(--c);border-color:var(--c);color:#14161f;font-weight:700;font-size:17px;padding:12px 22px}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--mute);gap:6px}
.empty .big{font-size:54px}
#ov{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#ov.show{display:flex}
#ov .bar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
#ov .bar b{flex:1}
#ov iframe{flex:1;border:0;width:100%;background:#0b0c10}
#ov .note{font-size:13px;color:var(--mute);padding:6px 14px calc(6px + env(safe-area-inset-bottom,0px))}
</style>
</head>

 document.querySelectorAll(".hs").forEach(function(e){e.classList.toggle("on",e.parentNode.dataset.id===id)});
 document.querySelectorAll(".chip[data-id]").forEach(function(e){e.classList.toggle("on",e.dataset.id===id)});
 panel.style.setProperty("--c",p.c);
 var h='<span class="tag">'+esc(p.tag)+'</span><h2>'+esc(p.title)+'</h2><p class="lead">'+esc(p.lead)+'</p>';
