<!DOCTYPE html>
<html>
<head>
    <title>Interactive Lunar Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            
            font-family: Arial, sans-serif;
            color: white;
        }
        #map-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        #map { 
            height: 70vh; 
            width: 80vw; 
            border: 2px solid #1f2833;
            border-radius: 8px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container" style="margin: 2rem auto; max-width: 1100px; height: auto;">
        <div class="nav-bar">
            <a href="index.html" class="nav-back-btn" style="color: #94a3b8;">← Back to Dashboard</a>
        </div>
        
        <header style="border-bottom: 2px solid #1f2833;">
            <h1 style="color: #38bdf8; font-size: 2.25rem; margin-bottom: 0.5rem;">Lunar Elevation Map</h1>
            <p style="color: #94a3b8;">Explore topographic variants using NASA LRO/LOLA data structures.</p>
        </header>
        
        <div id="map-container" style="display: block; height: 60vh; position: relative;">
            <div id="map" style="height: 100%; width: 100%;"></div>
        </div>
    </div>

    <script>

        // 1. Tell Leaflet to use EPSG:4326 (Plate Carrée / Simple Cylindrical) 
        // instead of default Web Mercator.
        var map = L.map('map', {
            crs: L.CRS.EPSG4326,
            minZoom: 1,
            maxZoom: 8
        }).setView([0, 0], 2);

        // 2. Connect directly to the USGS MapServer with strict parameters included
        L.tileLayer.wms('https://planetarymaps.usgs.gov/cgi-bin/mapserv', {
            map: '/maps/earth/moon_simp_cyl.map',
            layers: 'LOLA_color',
            styles: '',          // FIX: explicitly pass empty string for default style
            format: 'image/png',
            transparent: true,
            attribution: 'USGS Astrogeology | NASA LRO/LOLA'
        }).addTo(map);
    </script>
</body>
</html>
