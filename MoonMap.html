<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Lunar Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="style.css">
    
    <style>
        #map-container {
            display: block; 
            height: 55vh; 
            width: 100%;
            position: relative;
            margin-top: 1rem;
        }
        #map { 
            height: 100%; 
            width: 100%; 
            background-color: #1e293b; /* Fallback palette color matching style.css */
            border: 2px solid var(--border);
            border-radius: 12px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.05);
        }
        
        /* Coordinates inputs grouping dashboard container styling */
        .coordinate-bar {
            display: flex;
            gap: 1rem;
            margin: 1.5rem 0;
            align-items: flex-end;
            flex-wrap: wrap;
            background: var(--card-bg);
            padding: 1.25rem;
            border: 1px solid var(--border);
            border-radius: 12px;
        }
        .coord-input-group {
            flex: 1;
            min-width: 140px;
        }
        .coord-input-group label {
            display: block;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }
        .coord-input-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--background);
            color: var(--text-main);
            font-size: 1rem;
        }
        .go-btn {
            padding: 0.75rem 1.5rem;
            background-color: var(--primary);
            color: #ffffff;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            height: 45px;
            transition: background-color 0.2s, transform 0.1s;
        }
        .go-btn:hover {
            background-color: var(--primary-hover);
        }
        .go-btn:active {
            transform: scale(0.98);
        }

        /* Menu Overlay Theme Overrides to completely fit style.css elements */
        .leaflet-control-layers {
            background: var(--card-bg) !important;
            color: var(--text-main) !important;
            border: 1px solid var(--border) !important;
            border-radius: 8px !important;
            padding: 8px 12px !important;
            font-family: inherit !important;
            font-size: 0.85rem !important;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.08) !important;
        }
    </style>
</head>
<body>

    <div class="container" style="margin: 2rem auto; max-width: 1100px; height: auto;">
        <div class="nav-bar">
            <a href="index.html" class="nav-back-btn" style="text-decoration: none; color: var(--primary); font-weight: bold;">← Back to Dashboard</a>
        </div>
        
        <header style="margin-top: 1rem;">
            <h1 style="color: var(--primary); font-size: 2.25rem; margin-bottom: 0.5rem;">Lunar Observation Map</h1>
            <p style="color: var(--text-muted);">Explore topological elevation and mapping matrices via raw NASA data streams.</p>
        </header>
        
        <div class="coordinate-bar">
            <div class="coord-input-group">
                <label for="input-lat">Latitude (-90 to 90)</label>
                <input type="number" id="input-lat" placeholder="e.g. -12.4571" step="0.0001" min="-90" max="90">
            </div>
            <div class="coord-input-group">
                <label for="input-lng">Longitude (-180 to 180)</label>
                <input type="number" id="input-lng" placeholder="e.g. 43.6120" step="0.0001" min="-180" max="180">
            </div>
            <button id="btn-go" class="go-btn">Go to Target</button>
        </div>
        
        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <script>
        // 1. Configure Leaflet to use Lunar EPSG:4326 (Plate Carrée / Simple Cylindrical)
        var map = L.map('map', {
            crs: L.CRS.EPSG4326,
            minZoom: 1,
            maxZoom: 8,
            zoomControl: true
        }).setView([0, 0], 2);

        // 2. Define our 4 distinct USGS NASA Lunar WMS Layers
        var layerColorElevation = L.tileLayer.wms('https://planetarymaps.usgs.gov/cgi-bin/mapserv?map=/maps/earth/moon_simp_cyl.map', {
            layers: 'LOLA_color',
            format: 'image/png',
            transparent: false,
            attribution: 'USGS / NASA LRO'
        });

        var layerShadedRelief = L.tileLayer.wms('https://planetarymaps.usgs.gov/cgi-bin/mapserv?map=/maps/earth/moon_simp_cyl.map', {
            layers: 'LOLA_bw',
            format: 'image/png',
            transparent: false,
            attribution: 'USGS / NASA LRO'
        });

        var layerSteelElevation = L.tileLayer.wms('https://planetarymaps.usgs.gov/cgi-bin/mapserv?map=/maps/earth/moon_simp_cyl.map', {
            layers: 'LOLA_steel',
            format: 'image/png',
            transparent: false,
            attribution: 'USGS / NASA LRO'
        });

        var layerPhotography = L.tileLayer.wms('https://planetarymaps.usgs.gov/cgi-bin/mapserv?map=/maps/earth/moon_simp_cyl.map', {
            layers: 'LROC_WAC',
            format: 'image/png',
            transparent: false,
            attribution: 'ASU / NASA LRO'
        });

        // Add the primary default view straight onto the active viewport grid
        layerColorElevation.addTo(map);

        // 3. Construct the Registry Object for base map selections
        var baseLunarLayers = {
            "LOLA Color Elevation": layerColorElevation,
            "LOLA Shaded Relief": layerShadedRelief,
            "LOLA Steel Altimeter": layerSteelElevation,
            "LROC Photographic Mosaic": layerPhotography
        };

        // Inject the selector panel onto our initialized canvas structure
        L.control.layers(baseLunarLayers, null, { position: 'topright', collapsed: false }).addTo(map);

        // SAFEGUARD: Recalculate dimensions cleanly once the window settles
        setTimeout(function() {
            map.invalidateSize();
        }, 150);

        // Keep variable track of our active coordinate marker pin
        let searchMarker = null;

        // 4. Coordinate navigation logic handler
        document.getElementById('btn-go').addEventListener('click', function() {
            const latInput = document.getElementById('input-lat').value;
            const lngInput = document.getElementById('input-lng').value;
            
            const lat = parseFloat(latInput);
            const lng = parseFloat(lngInput);

            // Validation guards
            if (isNaN(lat) || isNaN(lng)) {
                alert('Please provide valid numerical coordinates for both fields.');
                return;
            }
            if (lat < -90 || lat > 90) {
                alert('Error: Latitude must be a value between -90 and 90 degrees.');
                return;
            }
            if (lng < -180 || lng > 180) {
                alert('Error: Longitude must be a value between -180 and 180 degrees.');
                return;
            }

            map.invalidateSize();

            // Shift current viewport frame
            const targetedZoom = map.getZoom() < 5 ? 5 : map.getZoom();
            map.setView([lat, lng], targetedZoom);

            // Create or move vector telemetry targeting point
            if (searchMarker) {
                searchMarker.setLatLng([lat, lng]);
            } else {
                searchMarker = L.circleMarker([lat, lng], {
                    radius: 12,            
                    color: 'var(--primary)', // Hooks smoothly into your style.css theme colors
                    fillColor: 'var(--primary)',  
                    fillOpacity: 0.3,      
                    weight: 2             
                }).addTo(map);
            }

            // Spawn information tooltip display box
            searchMarker.bindPopup(`
                <div style="color: #1e293b; font-family: sans-serif; font-size: 0.9rem; line-height: 1.4;">
                    <strong style="color: var(--primary);">Target Coordinates Locked</strong><br>
                    <span style="color: #64748b;">Latitude:</span> <strong>${lat.toFixed(4)}°</strong><br>
                    <span style="color: #64748b;">Longitude:</span> <strong>${lng.toFixed(4)}°</strong>
                </div>
            `).openPopup();
        });
    </script>
</body>
</html>
