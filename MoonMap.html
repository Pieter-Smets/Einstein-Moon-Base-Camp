<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Lunar Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="style.css">
    
    
</head>
<body>

    <div class="container page-wrapper moonmap">
        <div class="nav-bar">
            <a href="index.html" class="nav-back-btn">← Back to Dashboard</a>
        </div>
        
    <header class="page-header">
            <h1 class="page-title">Lunar Observation Map</h1>
            <p>Explore topological elevation and mapping matrices via raw NASA data streams.</p>
        </header>
        
        <div class="coordinate-bar">
            <div class="coord-input-group">
                <label for="input-lat">Latitude (-90 to 90)</label>
                <input type="number" id="input-lat" placeholder="e.g. -12.4571" step="0.0001" min="-90" max="90">
            </div>
            <div class="coord-input-group">
                <label for="input-lng">Longitude (-180 to 180)</label>
                <input type="number" id="input-lng" placeholder="e.g. 43.6120" step="0.0001" min="-180" max="180">
            </div>
            <button id="btn-go" class="go-btn">Go to Target</button>
        </div>
        
        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <script>
        // 1. Configure Leaflet to use Lunar EPSG:4326 (Plate Carrée / Simple Cylindrical)
        var map = L.map('map', {
            crs: L.CRS.EPSG4326,
            minZoom: 1,
            maxZoom: 8,
            zoomControl: true
        }).setView([0, 0], 2);

        // 2. Define our 4 distinct USGS NASA Lunar WMS Layers
        var layerColorElevation = L.tileLayer.wms('https://planetarymaps.usgs.gov/cgi-bin/mapserv?map=/maps/earth/moon_simp_cyl.map', {
            layers: 'LOLA_color',
            format: 'image/png',
            transparent: false,
            attribution: 'USGS / NASA LRO'
        });

        var layerShadedRelief = L.tileLayer.wms('https://planetarymaps.usgs.gov/cgi-bin/mapserv?map=/maps/earth/moon_simp_cyl.map', {
            layers: 'LOLA_bw',
            format: 'image/png',
            transparent: false,
            attribution: 'USGS / NASA LRO'
        });

        var layerSteelElevation = L.tileLayer.wms('https://planetarymaps.usgs.gov/cgi-bin/mapserv?map=/maps/earth/moon_simp_cyl.map', {
            layers: 'LOLA_steel',
            format: 'image/png',
            transparent: false,
            attribution: 'USGS / NASA LRO'
        });

        var layerPhotography = L.tileLayer.wms('https://planetarymaps.usgs.gov/cgi-bin/mapserv?map=/maps/earth/moon_simp_cyl.map', {
            layers: 'LROC_WAC',
            format: 'image/png',
            transparent: false,
            attribution: 'ASU / NASA LRO'
        });

        // Add the primary default view straight onto the active viewport grid
        layerColorElevation.addTo(map);

        // 3. Construct the Registry Object for base map selections
        var baseLunarLayers = {
            "LOLA Color Elevation": layerColorElevation,
            "LOLA Shaded Relief": layerShadedRelief,
            "LOLA Steel Altimeter": layerSteelElevation,
            "LROC Photographic Mosaic": layerPhotography
        };

        // Inject the selector panel onto our initialized canvas structure
        L.control.layers(baseLunarLayers, null, { position: 'topright', collapsed: false }).addTo(map);

        // SAFEGUARD: Recalculate dimensions cleanly once the window settles
        setTimeout(function() {
            map.invalidateSize();
        }, 150);

        // Keep variable track of our active coordinate marker pin
        let searchMarker = null;

        // 4. Coordinate navigation logic handler
        document.getElementById('btn-go').addEventListener('click', function() {
            const latInput = document.getElementById('input-lat').value;
            const lngInput = document.getElementById('input-lng').value;
            
            const lat = parseFloat(latInput);
            const lng = parseFloat(lngInput);

            // Validation guards
            if (isNaN(lat) || isNaN(lng)) {
                alert('Please provide valid numerical coordinates for both fields.');
                return;
            }
            if (lat < -90 || lat > 90) {
                alert('Error: Latitude must be a value between -90 and 90 degrees.');
                return;
            }
            if (lng < -180 || lng > 180) {
                alert('Error: Longitude must be a value between -180 and 180 degrees.');
                return;
            }

            map.invalidateSize();

            // Shift current viewport frame
            const targetedZoom = map.getZoom() < 5 ? 5 : map.getZoom();
            map.setView([lat, lng], targetedZoom);

            // Create or move vector telemetry targeting point
            if (searchMarker) {
                searchMarker.setLatLng([lat, lng]);
            } else {
                searchMarker = L.circleMarker([lat, lng], {
                    radius: 12,            
                    color: 'var(--primary)', // Hooks smoothly into your style.css theme colors
                    fillColor: 'var(--primary)',  
                    fillOpacity: 0.3,      
                    weight: 2             
                }).addTo(map);
            }

            // Spawn information tooltip display box
            searchMarker.bindPopup(`
                <div class="popup-info">
                    <strong class="popup-title">Target Coordinates Locked</strong><br>
                    <span class="popup-meta">Latitude:</span> <strong>${lat.toFixed(4)}°</strong><br>
                    <span class="popup-meta">Longitude:</span> <strong>${lng.toFixed(4)}°</strong>
                </div>
            `).openPopup();
        });
    </script>
</body>
</html>
